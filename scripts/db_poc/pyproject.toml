[project]
name = "card-pulse-db-poc"
version = "0.1.0"
description = "CP-0009 database PoC harness for PostgreSQL 18.6 and MariaDB 12.3.3"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbpoc"]
