name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ADR-0019。必須status checkに入っているjobへ置き、公開へ戻した変更が
      # 検査を外す差分として現れるようにする。
      - name: Check the repository stays private
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "ADR-0019: this repository must stay private (visibility reported as private=$IS_PRIVATE)." >&2
            echo "Publishing requires a new ADR that replaces ADR-0012 and ADR-0019." >&2
            exit 1
          fi

      - name: Check Markdown links
        run: python3 .agents/skills/check-doc-links/scripts/check_doc_links.py

      - name: Validate roadmap
        run: python3 .agents/skills/maintain-roadmap/scripts/validate_roadmap.py

  quality-checks:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # uvのversionはpyproject.tomlのrequired-version、CPythonのversionは
          # .python-versionが正。uv自身がそれらを読むため、ここでは重複して固定しない。
          version-file: pyproject.toml

      # ローカルと同じ入口を呼ぶ。検査内容はpyproject.tomlとscripts/check.pyが正。
      - name: Run format, lint, type check, and tests
        run: python3 scripts/check.py

  agent-configuration:
    name: Agent configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Codex and Claude Code parity
        run: python3 .agents/skills/maintain-tool-parity/scripts/check_tool_parity.py
