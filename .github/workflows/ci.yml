name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Markdown links
        run: python3 .agents/skills/check-doc-links/scripts/check_doc_links.py

      - name: Validate roadmap
        run: python3 .agents/skills/maintain-roadmap/scripts/validate_roadmap.py

  quality-checks:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # uvのversionはpyproject.tomlのrequired-version、CPythonのversionは
          # .python-versionが正。uv自身がそれらを読むため、ここでは重複して固定しない。
          version-file: pyproject.toml

      # ローカルと同じ入口を呼ぶ。検査内容はpyproject.tomlとscripts/check.pyが正。
      - name: Run format, lint, type check, and tests
        run: python3 scripts/check.py

  repository-ruleset:
    name: Repository ruleset
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # 適用はしない。CIから適用できると、mainを守る規則がmain経由で緩められる
      # （ADR-0021）。ここでは食い違いを報告するだけにする。
      - name: Check the enforced ruleset matches the committed one
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ruleset.py check

  agent-configuration:
    name: Agent configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check Codex and Claude Code parity
        run: python3 .agents/skills/maintain-tool-parity/scripts/check_tool_parity.py

  # 空のrunner上でCompose環境をbuildして起動し、各serviceのhealth checkとその依存の
  # 報告が通ることを確認する（ADR-0016）。続けてDBを止め、ADR-0005が求める障害分離が
  # 保たれることを検査する（`CP-0092`）。開発機がmacOS、runnerがLinux amd64のため、
  # この検査はWSL2構成の継続的な確認も兼ねる（ADR-0018）。DBを使うmigrationと
  # integration testの追加は`CP-0062`で行う。
  compose-environment:
    name: Compose environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # 手順の正はローカル開発環境Runbookで、CIも同じ入口（.envとdocker compose）を
      # 使う。.env.exampleから作るため、変数が増えてもこのworkflowは追随しなくてよい。
      # passwordはこの実行限りの値にする。runnerは実行後に破棄され、公開するportは
      # loopbackだけに閉じる。
      - name: Create .env with single-run passwords
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import secrets

          template = pathlib.Path(".env.example").read_text(encoding="utf-8")
          filled, count = re.subn(
              r"(?m)^([A-Z0-9_]*PASSWORD)=$",
              lambda match: f"{match.group(1)}={secrets.token_hex(32)}",
              template,
          )
          if not count:
              raise SystemExit(".env.example has no empty password assignment to fill")
          pathlib.Path(".env").write_text(filled, encoding="utf-8")
          print(f"filled {count} password assignment(s)")
          PY

      # このstepがbuildと起動とhealth checkの成否になる。--waitは全serviceのhealth
      # checkが成功するまで待ち、一つでも失敗または終了すれば非ゼロで終わる。
      # workerはbuildを宣言しないため、compose版によってはpullを先に試し、logへ
      # `pull access denied`を1行残す。imageはapi側のbuildで作られるため無害である。
      - name: Build the image and start every service
        run: docker compose up --build --wait --wait-timeout 300

      - name: Show the state of every service
        run: docker compose ps

      # health checkはlivenessだけを表す（ADR-0016）。runtime roleが作られない、
      # artifact volumeへ書けないといった失敗はprocessを落とさないため、healthyのまま
      # 壊れた環境が通ってしまう。依存の報告まで読んでそれを防ぐ。
      - name: Check the API reports every dependency as healthy
        run: |
          response="${RUNNER_TEMP}/api-dependencies.json"
          curl --fail --silent --show-error --output "$response" \
              "http://$(docker compose port api 8000)/health/dependencies"
          cat "$response"
          jq --exit-status '.status == "ok"' "$response" > /dev/null

      - name: Check the Worker reports every dependency as healthy
        run: |
          heartbeat="${RUNNER_TEMP}/worker-heartbeat.json"
          docker compose exec -T worker sh -c 'cat "$CARD_PULSE_WORKER_HEARTBEAT_PATH"' > "$heartbeat"
          cat "$heartbeat"
          jq --exit-status '.status == "ok"' "$heartbeat" > /dev/null

      # ここから障害分離の検査（`CP-0092`）。ADR-0005とADR-0016が求めるのは、DBが落ちても
      # APIとWorkerが動き続け、状態を報告することである。この性質は`CP-0012`と`CP-0061`で
      # 手元で一度確認しただけで、CIは正常系しか通していなかった。health checkを依存の状態
      # まで見る形へ変えると、DBを止めた時点でcontainerが失敗を数え始め、下のstepが落ちる。
      - name: Stop the database
        run: docker compose stop db

      # health checkのintervalは15秒。2周分待ってから見る。依存を見るhealth checkであれば
      # この時点で失敗が記録されている。retriesに達してunhealthyになるのを待たなくても、
      # 連続失敗回数がFailingStreakへ先に現れるため、そちらを見る。
      - name: Check the API and Worker stay healthy without the database
        run: |
          sleep 35
          docker compose ps
          for service in api worker; do
            container="$(docker compose ps --quiet "$service")"
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            streak="$(docker inspect --format '{{.State.Health.FailingStreak}}' "$container")"
            restarts="$(docker inspect --format '{{.RestartCount}}' "$container")"
            echo "$service: health=$status failing_streak=$streak restarts=$restarts"
            test "$status" = healthy
            test "$streak" -eq 0
            test "$restarts" -eq 0
          done

      # 依存の失敗をHTTP 500やconnection refusedにせず、200のbodyとして返すことが要点。
      # 落ちたAPIと、生きていて異常を報告しているAPIを、呼ぶ側が区別できなくなるため。
      - name: Check the API reports the outage and keeps answering
        run: |
          response="${RUNNER_TEMP}/api-degraded.json"
          code="$(curl --silent --show-error --max-time 30 --output "$response" \
              --write-out '%{http_code}' \
              "http://$(docker compose port api 8000)/health/dependencies")"
          cat "$response"
          test "$code" = 200
          jq --exit-status '.status == "degraded"' "$response" > /dev/null
          jq --exit-status '
            .dependencies[] | select(.name == "database")
            | .healthy == false and (.detail | length > 0)
          ' "$response" > /dev/null

      # heartbeatが`degraded`であることが、DBが落ちた後に書かれた証拠になる。probeが
      # 失敗しなければこの値にならない。前のstepでworker containerがhealthyであることを
      # 確かめており、worker側のhealth checkはheartbeatの新しさそのものなので、
      # 「止まった後も書き続けている」がこの2つで成立する。
      - name: Check the Worker keeps writing a degraded heartbeat
        run: |
          heartbeat="${RUNNER_TEMP}/worker-degraded.json"
          docker compose exec -T worker sh -c 'cat "$CARD_PULSE_WORKER_HEARTBEAT_PATH"' > "$heartbeat"
          cat "$heartbeat"
          jq --exit-status '.status == "degraded"' "$heartbeat" > /dev/null
          jq --exit-status '
            .dependencies[] | select(.name == "database") | .healthy == false
          ' "$heartbeat" > /dev/null
          jq --exit-status '
            .dependencies[] | select(.name == "artifact-storage") | .healthy == true
          ' "$heartbeat" > /dev/null

      - name: Restart the database
        run: docker compose start db

      # 復帰までの時間はrunnerの負荷で変わるため、固定の待ち時間ではなくpollingで待つ。
      # workerの巡回間隔は30秒なので、heartbeatが戻るまでAPIより遅れる。
      - name: Check both services recover once the database returns
        run: |
          deadline=$(( SECONDS + 120 ))
          while true; do
            api_status="$(curl --silent --max-time 30 \
                "http://$(docker compose port api 8000)/health/dependencies" \
                | jq -r '.status // "unreachable"')"
            worker_status="$(docker compose exec -T worker sh -c 'cat "$CARD_PULSE_WORKER_HEARTBEAT_PATH"' \
                | jq -r '.status // "unreadable"')"
            echo "api=$api_status worker=$worker_status"
            if [ "$api_status" = ok ] && [ "$worker_status" = ok ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "the services did not recover within 120s" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Report the environment after a failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps
